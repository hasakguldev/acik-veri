name: Canlı Kurları Güncelle

on:
  schedule:
    # Hafta içi (Pazartesi-Cuma) UTC 06:00 ile 16:00 arası her saat başı çalışır (Türkiye saati ile 09:00 - 19:00 arası)
    - cron: '0 6-16 * * 1-5'
  workflow_dispatch: # Manuel tetikleme için buton

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Gereksinimleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Veri Çekme Betiğini Çalıştır
        run: python scripts/fetch_live_rates.py

      - name: Değişiklikleri Git'e Ekle ve Push Et
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add finans/canli-kurlar.json
          
          # Eğer dosyada bir değişiklik varsa commit atıp pushla
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Otomatik Güncelleme: Canlı kurlar [skip ci]" && git push)
