name: Tarihsel Verileri Güncelle

on:
  schedule:
    # Her Cumartesi gece yarısı (UTC 00:00) çalışır (Haftada 1)
    - cron: '0 0 * * 6'
  workflow_dispatch: # Manuel tetikleme

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Gereksinimleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas
          
      - name: EVDS Tarihsel Verilerini Çek
        run: python scripts/fetch_evds.py --key ${{ secrets.EVDS_API_KEY }} --out finans/tarihsel-fiyatlar.json
        
      - name: Değişiklikleri Git'e Ekle ve Push Et
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add finans/tarihsel-fiyatlar.json tasks/evds-rapor.md
          
          # Eğer dosyada bir değişiklik varsa commit atıp pushla
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Otomatik Güncelleme: Tarihsel fiyatlar (EVDS) [skip ci]" && git push)
